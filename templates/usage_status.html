{% extends "base.html" %}
{% block page_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/public-service.css', v=1) }}">
{% endblock %}
{% block content %}
<div class="public-service public-service-form">
  <header class="public-service-intro">
    <h1>利用状況</h1>
  </header>

  <section class="public-service-panel" aria-labelledby="summary-title">
    <h2 id="summary-title">学生証の利用情報</h2>
    <dl class="public-service-result">
      <div><dt>残り利用回数</dt><dd>{{ stock }}回</dd></div>
      <div><dt>利用状況</dt><dd>{{ allow_text }}</dd></div>
      <div><dt>登録日</dt><dd>{{ entry_date }}</dd></div>
      {% if days_until is not none %}
        <div><dt>次に利用回数が増えるまで</dt><dd>{{ days_until }}日</dd></div>
      {% endif %}
    </dl>
  </section>

  <nav class="public-service-links" aria-label="確認後の操作">
    <a href="{{ url_for('usage') }}" class="btn btn-outline">別の学生証を確認する</a>
    <a href="{{ url_for('index') }}">ホームに戻る</a>
  </nav>
</div>
{% endblock %}
