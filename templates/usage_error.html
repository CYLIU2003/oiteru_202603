{% extends "base.html" %}
{% block page_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/public-service.css', v=1) }}">
{% endblock %}
{% block content %}
<div class="public-service public-service-form">
  <header class="public-service-intro">
    <h1>学生証を読み取れませんでした</h1>
  </header>

  <div class="public-service-notice public-service-notice-error">
    <p>学生証をカードリーダーの読み取り面に置き直して、もう一度お試しください。</p>
    <p>この画面はまもなくホームに戻ります。</p>
  </div>

  <nav class="public-service-links" aria-label="読み取り後の操作">
    <a href="{{ url_for('usage') }}" class="btn btn-primary">読み取り画面に戻る</a>
    <a href="{{ url_for('index') }}">ホームに戻る</a>
  </nav>
</div>
<script>
  setTimeout(() => window.location.assign({{ url_for('index') | tojson }}), 2500);
</script>
{% endblock %}
