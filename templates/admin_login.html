{% extends "base.html" %}

{% block breadcrumbs %}
<nav class="dads-breadcrumbs" aria-label="現在位置">
  <ol>
    <li><a href="{{ url_for('index') }}">ホーム</a></li>
    <li aria-current="page">管理者ログイン</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div class="dads-page dads-page-narrow">
  <section class="dads-card dads-stack-lg" aria-labelledby="admin-login-heading">
    <header class="dads-stack-sm">
      <p class="dads-shoulder">管理者専用</p>
      <h1 id="admin-login-heading" class="dads-heading-page">管理者ログイン</h1>
      <p class="dads-lead">子機監視・在庫補充・利用者管理を行うにはログインしてください。学生証の登録や利用状況確認はログイン不要です。</p>
    </header>

    <form method="post" class="dads-stack-md">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="dads-field">
        <label for="username" class="dads-label">
          ユーザー名
          <span class="dads-required">必須</span>
        </label>
        <p class="dads-support-text" id="username-support">管理者アカウントのユーザー名を入力してください。</p>
        <input
          type="text"
          name="username"
          id="username"
          class="dads-input"
          autocomplete="username"
          aria-describedby="username-support"
          required
          autofocus
        >
      </div>

      <div class="dads-field">
        <label for="password" class="dads-label">
          パスワード
          <span class="dads-required">必須</span>
        </label>
        <p class="dads-support-text" id="password-support">管理者アカウントのパスワードを入力してください。</p>
        <input
          type="password"
          name="password"
          id="password"
          class="dads-input"
          autocomplete="current-password"
          aria-describedby="password-support"
          required
        >
      </div>

      <div class="dads-stack-sm">
        <button type="submit" class="dads-btn dads-btn-solid dads-btn-lg dads-btn-full">ログインする</button>
      </div>
    </form>
  </section>

  <div>
    <a href="{{ url_for('index') }}" class="dads-back-link">利用者ホームに戻る</a>
  </div>
</div>
{% endblock %}
